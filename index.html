<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 Media Yükləyici</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/dropzone.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .dropzone {
      border: 2px dashed #667eea !important;
      background: #f8f9ff !important;
      border-radius: 12px;
      padding: 30px !important;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dropzone:hover {
      background: #f0f2ff !important;
      border-color: #764ba2 !important;
    }

    .dropzone.dz-drag-hover {
      background: #e8ebff !important;
      border-color: #764ba2 !important;
    }

    .dz-message {
      font-size: 16px;
      color: #667eea;
      font-weight: 500;
    }

    .dz-preview {
      display: none;
    }

    .gallery {
      margin-top: 40px;
    }

    .gallery-title {
      font-size: 18px;
      color: #333;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      max-height: 500px;
      overflow-y: auto;
    }

    .gallery-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: #f5f5f5;
      aspect-ratio: 1;
    }

    .gallery-item img,
    .gallery-item video,
    .gallery-item audio {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-item .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255,0,0,0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 16px;
      display: none;
    }

    .gallery-item:hover .delete-btn {
      display: block;
    }

    .audio-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 40px;
    }

    .loading {
      color: #667eea;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }

    .stats {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9ff;
      border-radius: 8px;
      font-size: 13px;
      color: #666;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 22px;
      }

      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 Media Yükləyici</h1>
    <p class="subtitle">Şəkil, video və səsi asanlıqla yüklə</p>

    <form action="/api/upload" class="dropzone" id="myDropzone">
      <div class="dz-message">
        💾 Faylları bura sürükləyib burax<br>
        <small>və ya kliklə faylları seçmək üçün</small>
      </div>
    </form>

    <div class="loading" id="loading" style="display: none;">
      ⏳ Yüklənir...
    </div>

    <div class="stats">
      📊 Yüklənmiş fayllar: <span id="total">0</span>
    </div>

    <div class="gallery">
      <div class="gallery-title">Galereya</div>
      <div class="gallery-grid" id="gallery"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/dropzone.min.js"></script>
  <script>
    Dropzone.options.myDropzone = {
      acceptedFiles: 'image/*,video/*,audio/*',
      maxFilesize: 100,
      maxFiles: 50,
      parallelUploads: 1,
      init: function() {
        this.on('sending', () => {
          document.getElementById('loading').style.display = 'block';
        });
        this.on('success', () => {
          document.getElementById('loading').style.display = 'none';
          loadGallery();
        });
        this.on('error', (file, error) => {
          document.getElementById('loading').style.display = 'none';
          alert('Xəta: ' + error);
        });
      }
    };

    function loadGallery() {
      fetch('/api/gallery')
        .then(res => res.json())
        .then(data => {
          const gallery = document.getElementById('gallery');
          gallery.innerHTML = '';

          document.getElementById('total').textContent = data.total;

          data.files.forEach(file => {
            const item = document.createElement('div');
            item.className = 'gallery-item';

            if (file.type === 'image') {
              item.innerHTML = `
                <img src="${file.url}" alt="${file.name}">
                <button class="delete-btn" onclick="deleteFile('${file.name}')">×</button>
              `;
            } else if (file.type === 'video') {
              item.innerHTML = `
                <video controls><source src="${file.url}"></video>
                <button class="delete-btn" onclick="deleteFile('${file.name}')">×</button>
              `;
            } else if (file.type === 'audio') {
              item.innerHTML = `
                <div class="audio-icon">🎵</div>
                <button class="delete-btn" onclick="deleteFile('${file.name}')">×</button>
              `;
            }

            gallery.appendChild(item);
          });
        });
    }

    function deleteFile(publicId) {
      if (confirm('Silmək istəsən?')) {
        fetch(`/api/delete/${publicId}`, { method: 'DELETE' })
          .then(res => res.json())
          .then(() => loadGallery());
      }
    }

    loadGallery();
  </script>
</body>
</html>
